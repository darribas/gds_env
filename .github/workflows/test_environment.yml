# Replaces the three dead test_* workflows (audit 2.1, 3.2), which operated on
# `gds_py/` -- a directory deleted in the June 2024 reorg -- and so could only
# fail. They also force-pushed to master to commit lockfiles; that whole
# mechanism is gone (the lockfiles themselves were deleted in audit 1.9), and
# this workflow has read-only permissions.
#
# What it is for now: the env specs are consumed by a multi-hour Docker build
# that only ever runs on a maintainer's machine. Solving and creating the same
# spec natively takes minutes and catches the common failure -- conda-forge
# drift making the spec unsatisfiable -- long before anyone spends an evening
# on `make build`. It is an early-warning check on the env spec, not a test of
# the published image.
#
# Both architectures are checked, at different depths (audit 3.1). The per-arch
# specs are generated from env/gds.yml, which is the only committed one.
#   * linux-64 gets a full create plus an import check -- the runner's native
#     platform, so the environment can actually be built and used.
#   * linux-aarch64 gets a dry-run solve. `--platform` resolves a foreign subdir
#     without installing anything, which is how audit 2.5 verified the arm64
#     exclusion list in the first place. Cheap, and until now the arm64 spec had
#     no automated check at all.
#
# Not macOS, deliberately:
#   * The spec is Docker-targeted. The arm64 exclusions were computed for
#     linux-aarch64, not osx-arm64 -- different platform, different package
#     availability -- so it is not the macOS spec, and there is no macOS spec.
#   * check_py_stack.ipynb resolves its own spec via `dpkg --print-architecture`
#     (cell 4), which does not exist on macOS.
#   * No image is published for macOS or Windows. The Windows workflow tested a
#     `.bat` installer that no longer exists; it was deleted outright.
name: Environment check

on:
  push:
    branches: [master]
    paths:
      - 'env/gds.yml'
      - 'env/generate_spec.py'
      - 'env/py/check_py_stack.ipynb'
      - '.github/workflows/test_environment.yml'
  pull_request:
    paths:
      - 'env/gds.yml'
      - 'env/generate_spec.py'
      - 'env/py/check_py_stack.ipynb'
      - '.github/workflows/test_environment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve:
    name: solve + import check (linux-64)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    defaults:
      run:
        shell: bash -leo pipefail {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          auto-activate-base: true
          activate-environment: ""

      # env/gds_amd64.yml is generated and gitignored (audit 3.1), so it does
      # not exist in a fresh checkout. check_py_stack.ipynb reads it too.
      - name: Generate the linux-64 spec
        run: |
          python3 env/generate_spec.py --arch amd64 --out env/gds_amd64.yml
          cat env/gds_amd64.yml

      # Fails fast and cheaply if conda-forge has drifted, before spending the
      # download budget on a full create.
      - name: Solve the spec (dry run)
        run: mamba env create -n gds --dry-run -f env/gds_amd64.yml

      - name: Create the environment
        run: mamba env create -n gds -f env/gds_amd64.yml

      - name: Log what resolved
        run: |
          conda activate gds
          conda info
          conda list

      # check_py_stack.ipynb declares kernelspec `gds` in its metadata. In the
      # image that name is registered by install_conda_env.sh; creating the env
      # here does not register anything, so nbconvert fails with NoSuchKernel.
      # Register it under the same name (display name differs -- GDS_ENV_VERSION
      # is a build arg that does not exist outside the image).
      - name: Register the gds kernelspec
        run: |
          conda activate gds
          python -m ipykernel install --user --name gds --display-name gds
          jupyter kernelspec list

      # nbconvert runs the notebook with its own directory as cwd, which is how
      # its `../gds_<arch>.yml` lookup resolves.
      - name: Run check_py_stack.ipynb
        run: |
          conda activate gds
          jupyter nbconvert --to html --execute env/py/check_py_stack.ipynb

      - name: Upload rendered notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check_py_stack
          path: env/py/check_py_stack.html
          if-no-files-found: warn
          retention-days: 14

  solve-arm64:
    name: solve (linux-aarch64, dry run)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        shell: bash -leo pipefail {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Miniforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          use-mamba: true
          auto-activate-base: true
          activate-environment: ""

      - name: Generate the linux-aarch64 spec
        run: |
          python3 env/generate_spec.py --arch arm64 --out env/gds_arm64.yml
          cat env/gds_arm64.yml

      # Resolves the aarch64 subdir from an x86 runner -- no emulation, no
      # install. A failure here means a flag in env/gds.yml is missing or stale:
      # some package, or a dependency of one, has no linux-aarch64 build. Each
      # flag comment names its reason and the date it was checked.
      - name: Solve the spec (dry run)
        run: mamba env create -n gds --dry-run --platform linux-aarch64 -f env/gds_arm64.yml
