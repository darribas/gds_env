# GDS environment spec -- the single source of truth for both architectures.
#
# Per-architecture specs are GENERATED from this file, never committed:
#
#     make env-specs            # writes env/gds_<arch>.yml for this host
#     python3 env/generate_spec.py --arch arm64 --out env/gds_arm64.yml
#
# `make build` and `make test` generate what they need automatically. The
# generated files are gitignored; do not edit them, and do not commit them.
#
# Architecture flags
# ------------------
# A package available everywhere is a plain entry:
#
#     - r-sf
#
# A package unavailable on some architecture stays a live entry and carries a
# flag naming the arch it is excluded from, the reason, and the date checked:
#
#     - r-duckdb   # !arm64: no linux-aarch64 build (checked 2026-08-20)
#
# The generator drops flagged lines when building that arch's spec and strips
# the flag comment everywhere else, so a generated spec is a plain package
# list. Flags are metadata for humans and the generator; they never reach
# conda.
#
# Other comment markers, which are NOT flags:
#   ####- pkg    retired on both arches, kept for provenance. Never emitted.
#   #- pkg       likewise -- the two markers are historical and synonymous.
#
# Exclusion review
# ----------------
# Last full re-check: 2026-08-20 (audit 2.5). Of the 56 packages then excluded
# on arm64, 48 had gained linux-aarch64 or noarch builds since the list was
# written; 44 were restored, and a `--platform linux-aarch64` solve rejected
# the other four (available themselves, but their deps are not). That leaves
# the 13 flags below. Re-check periodically -- conda-forge arm64 coverage
# keeps improving, and every flag is a package arm64 users do not get.
