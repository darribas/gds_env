# GDS environment spec -- linux-aarch64 (arm64).
#
# This file mirrors env/gds_amd64.yml. Any package change must be made in BOTH.
#
# Comment conventions, which differ and are load-bearing:
#   #####- pkg   excluded on arm64 ONLY -- conda-forge has no linux-aarch64
#                build. Every one carries its reason and the date it was last
#                checked. These are the only lines that may differ from the
#                amd64 spec.
#   ####- pkg    excluded on BOTH arches (kept for provenance).
#   #- pkg       excluded on BOTH arches (kept for provenance).
#
# Last full re-check of the arm64 exclusion set: 2026-08-20 (audit 2.5). 48 of
# the 56 packages previously excluded here had gained linux-aarch64 or noarch
# builds since the list was written, and were restored; the 9 exclusions below
# (8 R packages + simplification) were confirmed still unavailable and verified
# by a `mamba env create --dry-run --platform linux-aarch64` solve of this file
# (931 -> 1127 packages resolved).
# Re-check periodically -- conda-forge arm64 coverage keeps improving.
